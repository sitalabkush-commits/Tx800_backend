<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tx 800 Mini</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #040a10; background-image: linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px); background-size: 30px 30px; color: #00f0ff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        .top-bar { width: 100%; display: flex; justify-content: space-between; padding: 20px 15px; font-size: 10px; color: #80b0c0; }
        .top-badge { border: 1px solid #1a4a5a; padding: 4px 10px; border-radius: 15px; display: flex; align-items: center; gap: 5px; background: rgba(0,240,255,0.03); }
        .dot-green { color: #00ff66; font-size: 8px; } .dot-blue { color: #00f0ff; font-size: 8px; }
        
        .scanner-container { margin-top: 5vh; position: relative; width: 280px; height: 280px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .ring-outer { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 1px dashed rgba(0,240,255,0.2); animation: rotateRight 20s linear infinite; }
        .ring-inner { position: absolute; width: 70%; height: 70%; border-radius: 50%; border: 1px dashed rgba(0,240,255,0.4); animation: rotateLeft 15s linear infinite; }
        
        .center-core { width: 100px; height: 100px; background: radial-gradient(circle, rgba(0,240,255,0.15) 0%, rgba(4,10,16,1) 80%); border: 1.5px solid #00f0ff; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 25px rgba(0,240,255,0.4); z-index: 10; transition: all 0.3s; }
        .waveform { display: flex; gap: 3px; align-items: center; height: 30px; }
        .bar { width: 3px; background-color: #00f0ff; border-radius: 2px; box-shadow: 0 0 8px #00f0ff; height: 10px; }
        
        .status-container { margin-top: 30px; }
        .listening-text { font-size: 13px; letter-spacing: 4px; color: #b0d0e0; text-transform: uppercase; }
        
        .response-box { margin-top: 30px; width: 92%; background: rgba(4,15,25,0.7); border: 1px solid #103a4a; border-radius: 15px; padding: 18px; display: none; }
        .response-header { display: flex; justify-content: space-between; font-size: 10px; color: #00f0ff; padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid rgba(0,240,255,0.15); }
        .response-content { font-size: 14px; line-height: 1.6; color: #c0dce8; font-family: Arial, sans-serif; }

        @keyframes rotateRight { 100% { transform: rotate(360deg); } }
        @keyframes rotateLeft { 100% { transform: rotate(-360deg); } }
        .listening .center-core { border-color: #00ffaa; box-shadow: 0 0 35px rgba(0,255,170,0.5); }
        .listening .bar { background-color: #00ffaa; }
        .show-ui { display: block !important; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-badge"><span class="dot-blue">●</span> HEARING</div>
        <div class="top-badge"><span class="dot-green">●</span> BG: ACTIVE</div>
        <div class="top-badge"><span class="dot-blue">●</span> FACE LOCK</div>
    </div>

    <div class="scanner-container" id="micContainer">
        <div class="ring-outer"></div>
        <div class="ring-inner"></div>
        <div class="center-core" id="core">
            <div class="waveform">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
        </div>
    </div>

    <div class="status-container">
        <div class="listening-text" id="statusText">TAP TO START</div>
    </div>

    <div class="response-box" id="responseBox">
        <div class="response-header"><span>⏱️ RESPONSE SYNTHESIS</span><span>CONFIDENCE 99.4%</span></div>
        <div class="response-content" id="botReply">...</div>
    </div>

    <script>
        // এখানে আপনার Vercel API লিংক দিন (শেষে /api থাকতে হবে)
        const API_URL = "https://tx800-backend.vercel.app/api"; 
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        let mediaRecorder, audioChunks = [], isRecording = false;
        const micContainer = document.getElementById('micContainer');
        const statusText = document.getElementById('statusText');
        const botReply = document.getElementById('botReply');
        const body = document.body;
        const responseBox = document.getElementById('responseBox');

        micContainer.addEventListener('click', async () => {
            // অডিও পারমিশন ট্রিক
            let silentAudio = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA");
            silentAudio.play().catch(e => {});

            if (isRecording) { stopRecording(); return; }
            responseBox.classList.add('show-ui');
            botReply.innerText = "Tx is listening to you...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // মোবাইলের জন্য 'audio/mp4' ফরম্যাট সিলেক্ট করা হলো
                let options = { mimeType: 'audio/mp4' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'audio/webm' }; // ফ্যালব্যাক
                }

                mediaRecorder = new MediaRecorder(stream, options);
                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                    audioChunks = [];
                    sendAudioToBackend(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;
                body.classList.add('listening');
                statusText.innerText = "LISTENING...";
                
                setTimeout(() => { if (isRecording) stopRecording(); }, 5000);
            } catch (err) {
                botReply.innerText = "মাইক্রোফোনের অনুমতি দিন।";
                statusText.innerText = "ERROR";
            }
        });

        function stopRecording() {
            mediaRecorder.stop();
            isRecording = false;
            body.classList.remove('listening');
            statusText.innerText = "PROCESSING...";
        }

        async function sendAudioToBackend(audioBlob) {
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = async () => {
                const base64Audio = reader.result.split(',')[1];
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: "tx_user", audio: base64Audio })
                    });
                    
                    const data = await response.json();
                    botReply.innerText = data.reply;
                    statusText.innerText = "TAP TO TALK AGAIN";
                    
                    // ভয়েস প্লে
                    const utterance = new SpeechSynthesisUtterance(data.reply);
                    utterance.lang = 'bn-BD'; 
                    utterance.onstart = () => { statusText.innerText = "SPEAKING..."; };
                    utterance.onend = () => { statusText.innerText = "TAP TO TALK"; };
                    window.speechSynthesis.speak(utterance);

                } catch (error) {
                    botReply.innerText = "সার্ভারের সাথে কানেক্ট করা যাচ্ছে না।";
                    statusText.innerText = "ERROR";
                }
            };
        }
    </script>
</body>
</html>
