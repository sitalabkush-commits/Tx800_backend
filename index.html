<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tx 800 Mini</title>
    <!-- টেলিগ্রাম স্ক্রিপ্ট -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* গ্লোবাল সেটিংস */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #040a10;
            /* ছবির মতো হালকা গ্রিড ব্যাকগ্রাউন্ড */
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* টপ বার (সিস্টেম ইনফো) */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 20px 15px;
            font-size: 10px;
            letter-spacing: 1px;
            color: #80b0c0;
        }

        .top-badge {
            border: 1px solid #1a4a5a;
            padding: 4px 10px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 240, 255, 0.03);
        }

        .dot-green { color: #00ff66; text-shadow: 0 0 5px #00ff66; font-size: 8px; }
        .dot-blue { color: #00f0ff; text-shadow: 0 0 5px #00f0ff; font-size: 8px; }

        /* মেইন স্ক্যানার এরিয়া (এখানে ক্লিক করলে মাইক চালু হবে) */
        .scanner-container {
            margin-top: 5vh;
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer; /* ক্লিক করার জন্য হাতের আইকন */
        }

        /* বাইরের রিং */
        .ring-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px dashed rgba(0, 240, 255, 0.2);
            animation: rotateRight 20s linear infinite;
        }

        /* ভেতরের রিং */
        .ring-inner {
            position: absolute;
            width: 70%;
            height: 70%;
            border-radius: 50%;
            border: 1px dashed rgba(0, 240, 255, 0.4);
            animation: rotateLeft 15s linear infinite;
        }

        /* অরবিটাল ডট (সাদা বিন্দু) */
        .orbit-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px #fff, 0 0 15px #00f0ff;
        }
        .od1 { top: 15%; left: 48%; }
        .od2 { bottom: 25%; right: 20%; }
        .od3 { top: 45%; left: 15%; }
        .od4 { bottom: 15%; left: 40%; width: 3px; height: 3px; opacity: 0.7;}

        /* সেন্টার কোর (মাইক) */
        .center-core {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(0,240,255,0.15) 0%, rgba(4,10,16,1) 80%);
            border: 1.5px solid #00f0ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4), inset 0 0 20px rgba(0, 240, 255, 0.2);
            z-index: 10;
            position: relative;
            transition: all 0.3s;
        }

        /* ওয়েভফর্ম প্যাটার্ন */
        .waveform {
            display: flex;
            gap: 3px;
            align-items: center;
            height: 30px;
        }
        
        .bar {
            width: 3px;
            background-color: #00f0ff;
            border-radius: 2px;
            box-shadow: 0 0 8px #00f0ff;
            height: 10px;
            transition: height 0.15s ease;
        }

        /* স্ট্যাটাস টেক্সট */
        .status-container {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .listening-text {
            font-size: 13px;
            letter-spacing: 4px;
            color: #b0d0e0;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .progress-bar {
            width: 220px;
            height: 3px;
            background: #0a1a24;
            border-radius: 2px;
            overflow: hidden;
            display: none; /* ডিফল্টভাবে লুকানো থাকবে */
        }
        
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #00f0ff;
            box-shadow: 0 0 10px #00f0ff;
            transition: width 0.1s;
        }

        /* রেসপন্স বক্স (বটের লেখা) */
        .response-box {
            margin-top: 30px;
            width: 92%;
            background: rgba(4, 15, 25, 0.7);
            border: 1px solid #103a4a;
            border-radius: 15px;
            padding: 18px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.05), inset 0 0 15px rgba(0,240,255,0.03);
            display: none; /* ডিফল্টভাবে লুকানো থাকবে */
        }

        .response-header {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #00f0ff;
            padding-bottom: 10px;
            margin-bottom: 12px;
            letter-spacing: 1.5px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
        }

        .response-content {
            font-size: 14px;
            line-height: 1.6;
            color: #c0dce8;
            font-family: Arial, sans-serif;
        }

        /* অ্যানিমেশন Keyframes */
        @keyframes rotateRight { 100% { transform: rotate(360deg); } }
        @keyframes rotateLeft { 100% { transform: rotate(-360deg); } }
        
        /* জাভাস্ক্রিপ্টের জন্য অ্যাক্টিভ স্টেট */
        .listening .center-core { border-color: #00ffaa; box-shadow: 0 0 35px rgba(0, 255, 170, 0.5); }
        .listening .bar { background-color: #00ffaa; box-shadow: 0 0 10px #00ffaa; }
        .listening .listening-text { color: #00ffaa; text-shadow: 0 0 5px #00ffaa; }
        
        /* ক্লিক করার পর দেখানোর ক্লাস */
        .show-ui { display: flex !important; }
        .show-bar { display: block !important; }
    </style>
</head>
<body>

    <!-- টপ ইনফো বার -->
    <div class="top-bar">
        <div class="top-badge"><span class="dot-blue">●</span> HEARING</div>
        <div class="top-badge"><span class="dot-green">●</span> BG: ACTIVE</div>
        <div class="top-badge"><span class="dot-blue">●</span> FACE LOCK</div>
    </div>

    <!-- মেইন স্ক্যানার (এখানে ট্যাপ করলে মাইক চালু হবে) -->
    <div class="scanner-container" id="micContainer">
        <div class="ring-outer"></div>
        <div class="ring-inner"></div>
        
        <div class="orbit-dot od1"></div>
        <div class="orbit-dot od2"></div>
        <div class="orbit-dot od3"></div>
        <div class="orbit-dot od4"></div>

        <div class="center-core" id="core">
            <div class="waveform">
                <div class="bar" id="b1"></div><div class="bar" id="b2"></div><div class="bar" id="b3"></div><div class="bar" id="b4"></div><div class="bar" id="b5"></div>
            </div>
        </div>
    </div>

    <!-- স্ট্যাটাস -->
    <div class="status-container">
        <div class="listening-text" id="statusText">TAP TO START</div>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <!-- রেসপন্স বক্স -->
    <div class="response-box" id="responseBox">
        <div class="response-header">
            <span>⏱️ RESPONSE SYNTHESIS</span>
            <span>CONFIDENCE 99.4%</span>
        </div>
        <div class="response-content" id="botReply">
            ...
        </div>
    </div>

    <script>
        // ==========================================
        // ১. এখানে আপনার Vercel-এর লিংকটি বসান
        // ==========================================
        const API_URL = "https://tx800-backend.vercel.app/api"; 
        
        // টেলিগ্রাম ইনিশিয়ালাইজ
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // ভেরিয়েবল
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let audioPlayer = new Audio();
        
        // HTML এলিমেন্ট
        const micContainer = document.getElementById('micContainer');
        const statusText = document.getElementById('statusText');
        const botReply = document.getElementById('botReply');
        const body = document.body;
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const responseBox = document.getElementById('responseBox');
        const bars = [document.getElementById('b1'), document.getElementById('b2'), document.getElementById('b3'), document.getElementById('b4'), document.getElementById('b5')];

        // মাইক অ্যানিমেশন (শুধু দেখানোর জন্য)
        function animateWaveform(active) {
            bars.forEach(bar => {
                if(active) {
                    bar.style.height = Math.floor(Math.random() * 25 + 10) + 'px';
                } else {
                    bar.style.height = '10px';
                }
            });
        }
        setInterval(() => { if (isRecording) animateWaveform(true); }, 100);

        // ==========================================
        // ২. মাইকে ক্লিক করলে কী হবে
        // ==========================================
        micContainer.addEventListener('click', async () => {
            // যদি অলরেডি রেকর্ডিং চলে, তবে থামিয়ে দেব
            if (isRecording) {
                stopRecording();
                return;
            }

            // প্রথমবার ক্লিক করলে UI দেখাবে
            progressBar.classList.add('show-bar');
            responseBox.classList.add('show-ui');
            botReply.innerText = "Tx is listening to you...";

            try {
                // মাইক পারমিশন নিন
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                
                // রেকর্ডিং শেষ হলে সার্ভারে পাঠাবে
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];
                    sendAudioToBackend(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;
                body.classList.add('listening');
                statusText.innerText = "LISTENING...";
                progressFill.style.width = "100%";
                
                // ৫ সেকেন্ড পর নিজে থেকেই রেকর্ডিং বন্ধ হবে
                setTimeout(() => {
                    if (isRecording) stopRecording();
                }, 5000);

            } catch (err) {
                botReply.innerText = "Microphone access denied. Please allow it in settings.";
                statusText.innerText = "ERROR";
            }
        });

        function stopRecording() {
            mediaRecorder.stop();
            isRecording = false;
            body.classList.remove('listening');
            statusText.innerText = "PROCESSING...";
            progressFill.style.width = "0%";
            animateWaveform(false);
        }

        // ==========================================
        // ৩. অডিও ডেটা Vercel-এ পাঠানো এবং উত্তর নেওয়া
        // ==========================================
        async function sendAudioToBackend(audioBlob) {
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = async () => {
                const base64Audio = reader.result.split(',')[1];

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: tg.initDataUnsafe?.user?.id || "test_user_123",
                            audio: base64Audio
                        })
                    });
                    
                    const data = await response.json();
                    
                    // UI-তে বটের লেখা দেখানো
                    botReply.innerText = data.reply;
                    statusText.innerText = "TAP TO TALK AGAIN";
                    
                    // ==========================================
                    // ৪. ভয়েস আউটপুট তৈরি করা (ব্রাউজারের TTS)
                    // ==========================================
                    const utterance = new SpeechSynthesisUtterance(data.reply);
                    utterance.lang = 'bn-BD'; // বাংলা ভয়েস
                    
                    // বট যখন কথা বলবে, তখন UI অ্যানিমেশন দেখাবে
                    utterance.onstart = () => {
                        body.classList.add('listening');
                        statusText.innerText = "SPEAKING...";
                    };
                    utterance.onend = () => {
                        body.classList.remove('listening');
                        statusText.innerText = "TAP TO TALK";
                    };
                    window.speechSynthesis.speak(utterance);

                } catch (error) {
                    console.error(error);
                    botReply.innerText = "Connection error. Please check your API link.";
                    statusText.innerText = "ERROR";
                }
            };
        }
    </script>
</body>
</html>
